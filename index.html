<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>28 AUG 2004</title>
<style>
  :root{ --vhs-orange:#ff9a3d; }
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New','Lucida Console',monospace;-webkit-tap-highlight-color:transparent;}
  #stage-wrap{position:fixed;inset:0;width:100%;height:100%;background:#0a0a0a;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #camera-shake{width:100%;height:100%;position:relative;animation:camShake .6s steps(2) infinite;transform-origin:center center;}
  @keyframes camShake{0%{transform:translate(0,0) rotate(0deg);}20%{transform:translate(.6px,-.4px) rotate(.03deg);}40%{transform:translate(-.5px,.5px) rotate(-.02deg);}60%{transform:translate(.4px,.3px) rotate(.02deg);}80%{transform:translate(-.6px,-.3px) rotate(-.03deg);}100%{transform:translate(0,0) rotate(0deg);}}
  #video-look{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);pointer-events:none;z-index:20;mix-blend-mode:multiply;}
  #color-cast{position:absolute;inset:0;pointer-events:none;z-index:19;background:linear-gradient(180deg, rgba(255,220,180,.05), rgba(120,140,160,.06));mix-blend-mode:overlay;}
  #scene{position:absolute;inset:0;filter:saturate(.85) contrast(1.05) brightness(1.02) blur(.3px);}
  svg#sceneSvg{width:100%;height:100%;display:block;}
  #scanlines{position:absolute;inset:0;z-index:22;pointer-events:none;background:repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0px, rgba(0,0,0,.16) 1px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 3px);mix-blend-mode:multiply;opacity:.55;animation:scanDrift 7s linear infinite;}
  @keyframes scanDrift{0%{background-position-y:0px;}100%{background-position-y:200px;}}
  #flicker{position:absolute;inset:0;z-index:23;pointer-events:none;background:#fff;opacity:0;animation:flick 5.3s infinite;}
  @keyframes flick{0%,96%,100%{opacity:0;}97%{opacity:.03;}97.5%{opacity:0;}98.3%{opacity:.05;}98.6%{opacity:0;}}
  canvas#grain{position:absolute;inset:0;z-index:24;pointer-events:none;width:100%;height:100%;opacity:.16;mix-blend-mode:overlay;}
  #trackingBar{position:absolute;left:0;right:0;height:14px;background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0));top:-20px;z-index:25;pointer-events:none;opacity:0;}
  #timestamp{position:absolute;right:18px;bottom:16px;z-index:30;color:var(--vhs-orange);font-size:15px;line-height:1.35;letter-spacing:1.5px;text-align:right;text-shadow:0 0 2px rgba(255,154,61,.9),0 0 6px rgba(255,120,20,.5);font-weight:bold;user-select:none;opacity:.92;animation:tsFlicker 4s infinite;}
  @keyframes tsFlicker{0%,92%,100%{opacity:.92;}93%{opacity:.75;}94%{opacity:.92;}}
  #timestamp .rec{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-bottom:2px;font-size:13px;color:#ff4d3d;text-shadow:0 0 3px rgba(255,60,40,.9),0 0 6px rgba(255,30,10,.5);}
  #timestamp .dot{width:8px;height:8px;border-radius:50%;background:#ff2d1f;box-shadow:0 0 5px 1px rgba(255,40,20,.9);animation:recBlink 1s steps(1) infinite;}
  @keyframes recBlink{0%,49%{opacity:1;}50%,100%{opacity:.15;}}
  #messageBox{position:absolute;left:0;right:0;bottom:56px;z-index:30;display:flex;justify-content:center;pointer-events:none;padding:0 16px;}
  #messageText{color:var(--vhs-orange);font-size:20px;letter-spacing:1px;text-shadow:0 0 3px rgba(255,154,61,.85),0 0 8px rgba(255,110,20,.45);font-weight:bold;white-space:pre-wrap;text-align:center;max-width:90%;}
  #messageText .caret{display:inline-block;width:9px;background:var(--vhs-orange);margin-left:2px;animation:caretBlink .6s steps(1) infinite;}
  @keyframes caretBlink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
  #musicBtn{position:absolute;top:14px;left:14px;z-index:40;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,154,61,.75);color:var(--vhs-orange);font-family:'Courier New',monospace;font-size:13px;letter-spacing:1px;padding:8px 12px;border-radius:4px;cursor:pointer;backdrop-filter:blur(1px);text-shadow:0 0 3px rgba(255,154,61,.7);transition:background .2s ease, transform .1s ease;}
  #musicBtn:hover{background:rgba(0,0,0,.65);}
  #musicBtn:active{transform:scale(.96);}
  #topLabel{position:absolute;top:14px;right:16px;z-index:30;color:var(--vhs-orange);font-size:13px;letter-spacing:2px;text-shadow:0 0 3px rgba(255,154,61,.8);opacity:.85;user-select:none;}
  @media (max-width:640px){
    #timestamp{font-size:12px;right:10px;bottom:10px;}
    #timestamp .rec{font-size:11px;}
    #messageText{font-size:15px;}
    #messageBox{bottom:46px;}
    #musicBtn{font-size:11px;padding:6px 9px;top:10px;left:10px;}
    #topLabel{font-size:11px;top:10px;right:10px;}
  }
</style>
</head>
<body>

<div id="stage-wrap">
  <div id="camera-shake">
    <div id="scene">
      <svg id="sceneSvg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#cfe6d8"/>
            <stop offset="60%" stop-color="#e9e1c4"/>
            <stop offset="100%" stop-color="#d8c9a3"/>
          </linearGradient>
          <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9fae6e"/>

          </linearGradient>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6d8" stop-opacity=".9"/>

        </defs>

        <rect x="0" y="0" width="800" height="500" fill="url(#skyGrad)"/>
        <circle cx="650" cy="90" r="120" fill="url(#sunGlow)"/>
        <rect x="0" y="330" width="800" height="170" fill="url(#groundGrad)"/>
        <ellipse cx="120" cy="335" rx="220" ry="55" fill="#b9c98d" opacity=".7"/>
        <ellipse cx="620" cy="345" rx="260" ry="60" fill="#aebd82" opacity=".6"/>
        <g opacity=".85">
          <rect x="70" y="255" width="10" height="70" fill="#7a5c3e"/>
          <ellipse cx="75" cy="240" rx="42" ry="38" fill="#7fa15c"/>
          <ellipse cx="50" cy="255" rx="30" ry="26" fill="#729353"/>
          <ellipse cx="100" cy="255" rx="30" ry="26" fill="#8bab63"/>
        </g>
        <g opacity=".8">
          <rect x="705" y="265" width="9" height="60" fill="#7a5c3e"/>
          <ellipse cx="710" cy="252" rx="36" ry="32" fill="#7fa15c"/>
        </g>
        <g fill="#647b3f" opacity=".8">
          <path d="M40,400 q4,-18 8,0 q4,-22 8,0 q4,-16 8,0"/>
          <path d="M600,410 q4,-16 8,0 q4,-20 8,0 q4,-14 8,0"/>
          <path d="M690,420 q4,-14 8,0 q4,-18 8,0"/>
        </g>

        <ellipse id="groundShadow" cx="400" cy="430" rx="150" ry="20" fill="#000" opacity=".18"/>

        <!-- ============ MONKEY ============ -->
        <g id="monkey" transform="translate(400,300)">
          <g id="monkeyBody">

            <path id="monkeyTail" d="M 55,40 Q 110,30 105,-20 Q 100,-55 70,-50" fill="none" stroke="#7a4a2b" stroke-width="14" stroke-linecap="round"/>

            <ellipse cx="-28" cy="105" rx="20" ry="26" fill="#8a5a34"/>
            <ellipse cx="30" cy="105" rx="20" ry="26" fill="#8a5a34"/>
            <ellipse cx="-28" cy="122" rx="14" ry="9" fill="#6b4423"/>
            <ellipse cx="30" cy="122" rx="14" ry="9" fill="#6b4423"/>

            <ellipse cx="0" cy="40" rx="58" ry="66" fill="#8a5a34"/>
            <ellipse cx="0" cy="52" rx="34" ry="42" fill="#e7cf9f"/>

            <!-- dynamic arms drawn by JS: paths built from shoulder->elbow-control->hand each frame -->
            <path id="armBack" fill="none" stroke="#8a5a34" stroke-width="22" stroke-linecap="round"/>
            <circle id="handBack" r="12" fill="#8a5a34"/>

            <g id="monkeyHead" transform="translate(0,-58)">
              <circle cx="-46" cy="-4" r="20" fill="#8a5a34"/>
              <circle cx="46" cy="-4" r="20" fill="#8a5a34"/>
              <circle cx="-46" cy="-4" r="11" fill="#d9b789"/>
              <circle cx="46" cy="-4" r="11" fill="#d9b789"/>
              <circle cx="0" cy="0" r="48" fill="#8a5a34"/>
              <ellipse cx="0" cy="10" rx="34" ry="30" fill="#e7cf9f"/>
              <path id="browL" d="M -22,-10 Q -14,-16 -6,-10" fill="none" stroke="#4a2f1a" stroke-width="3.2" stroke-linecap="round"/>
              <path id="browR" d="M 6,-10 Q 14,-16 22,-10" fill="none" stroke="#4a2f1a" stroke-width="3.2" stroke-linecap="round"/>
              <g id="eyeL"><ellipse cx="-14" cy="2" rx="7.2" ry="8.2" fill="#fff"/><circle cx="-13" cy="3" r="4.2" fill="#3a2617"/><circle cx="-11.3" cy="1.3" r="1.3" fill="#fff"/></g>
              <g id="eyeR"><ellipse cx="14" cy="2" rx="7.2" ry="8.2" fill="#fff"/><circle cx="15" cy="3" r="4.2" fill="#3a2617"/><circle cx="16.7" cy="1.3" r="1.3" fill="#fff"/></g>
              <rect id="lidL" x="-22" y="-8" width="16" height="10" fill="#8a5a34" opacity="0"/>
              <rect id="lidR" x="6" y="-8" width="16" height="10" fill="#8a5a34" opacity="0"/>
              <ellipse cx="0" cy="16" rx="9" ry="6" fill="#c9a06d"/>
              <path id="monkeyMouth" d="M -9,22 Q 0,29 9,22" fill="none" stroke="#4a2f1a" stroke-width="2.4" stroke-linecap="round"/>
            </g>

            <path id="armFront" fill="none" stroke="#8a5a34" stroke-width="24" stroke-linecap="round"/>
            <circle id="handFront" r="13" fill="#8a5a34"/>
          </g>
        </g>

        <!-- ============ BABY GOAT (redesigned: floppy ears, horns, lashes, socks, tuft) ============ -->
        <g id="goatLift" transform="translate(400,300)">
          <g id="goat">
            <!-- tail -->
            <path d="M 28,6 Q 42,2 42,-10 Q 44,-18 36,-16" fill="none" stroke="#e8b45a" stroke-width="8" stroke-linecap="round"/>
            <ellipse cx="38" cy="-14" rx="6" ry="5" fill="#f5d98b"/>

            <!-- dangling legs with white socks + hooves -->
            <path id="legL1" d="M -14,24 Q -18,42 -15,56" fill="none" stroke="#f0d18f" stroke-width="9" stroke-linecap="round"/>
            <path id="legL1s" d="M -16,48 Q -16,54 -15,56" fill="none" stroke="#fff8ea" stroke-width="9" stroke-linecap="round"/>
            <ellipse id="hoofL1" cx="-15" cy="57" rx="5" ry="4" fill="#8a6435"/>

            <path id="legL2" d="M -4,26 Q -6,44 -4,58" fill="none" stroke="#f0d18f" stroke-width="9" stroke-linecap="round"/>
            <path id="legL2s" d="M -5,50 Q -5,56 -4,58" fill="none" stroke="#fff8ea" stroke-width="9" stroke-linecap="round"/>
            <ellipse id="hoofL2" cx="-4" cy="59" rx="5" ry="4" fill="#8a6435"/>

            <path id="legR1" d="M 6,26 Q 8,44 6,58" fill="none" stroke="#f0d18f" stroke-width="9" stroke-linecap="round"/>
            <path id="legR1s" d="M 5,50 Q 5,56 6,58" fill="none" stroke="#fff8ea" stroke-width="9" stroke-linecap="round"/>
            <ellipse id="hoofR1" cx="6" cy="59" rx="5" ry="4" fill="#8a6435"/>

            <path id="legR2" d="M 15,24 Q 19,42 16,56" fill="none" stroke="#f0d18f" stroke-width="9" stroke-linecap="round"/>
            <path id="legR2s" d="M 17,48 Q 17,54 16,56" fill="none" stroke="#fff8ea" stroke-width="9" stroke-linecap="round"/>
            <ellipse id="hoofR2" cx="16" cy="57" rx="5" ry="4" fill="#8a6435"/>

            <!-- body: golden fluffy -->
            <ellipse cx="0" cy="6" rx="34" ry="29" fill="#f5d98b"/>
            <ellipse cx="0" cy="13" rx="19" ry="15" fill="#fff3d6"/>

            <g id="goatHead" transform="translate(2,-32)">
              <!-- floppy ears (droop outward/down) -->
              <path id="earL" d="M -20,-8 Q -40,-4 -36,18 Q -32,30 -18,22 Q -22,4 -14,-10 Z" fill="#f0c874"/>
              <path id="earLin" d="M -22,-2 Q -32,4 -28,18 Q -24,24 -18,18 Q -20,6 -16,-6 Z" fill="#f9c9c0"/>
              <path id="earR" d="M 24,-8 Q 44,-4 40,18 Q 36,30 22,22 Q 26,4 18,-10 Z" fill="#f0c874"/>
              <path id="earRin" d="M 26,-2 Q 36,4 32,18 Q 28,24 22,18 Q 24,6 20,-6 Z" fill="#f9c9c0"/>

              <!-- small curved horns -->
              <path d="M -10,-24 Q -14,-32 -9,-38 Q -6,-33 -8,-25 Z" fill="#a9773f"/>
              <path d="M 10,-24 Q 14,-32 9,-38 Q 6,-33 8,-25 Z" fill="#a9773f"/>

              <!-- forelock tuft -->
              <path d="M -10,-24 Q 0,-32 10,-24 Q 4,-20 0,-23 Q -4,-20 -10,-24 Z" fill="#f5d98b"/>

              <!-- head shape -->
              <circle cx="0" cy="0" r="26" fill="#f9e3ac"/>
              <ellipse cx="0" cy="4" rx="18" ry="15" fill="#fff6dd"/>

              <!-- eyebrows (surprise) -->
              <path id="goatBrowL" d="M -15,-11 Q -10,-17 -3,-13" fill="none" stroke="#6b5738" stroke-width="2.4" stroke-linecap="round"/>
              <path id="goatBrowR" d="M 3,-13 Q 10,-17 15,-11" fill="none" stroke="#6b5738" stroke-width="2.4" stroke-linecap="round"/>

              <!-- big eyes with lashes -->
              <g id="goatEyeL">
                <ellipse cx="-10" cy="-1" rx="7" ry="8.4" fill="#fff"/>
                <circle cx="-9.4" cy="0.8" r="4.9" fill="#4a2f1c"/>
                <circle cx="-7.6" cy="-1.6" r="1.7" fill="#fff"/>
                <path d="M -16,-8 Q -13,-11 -10,-9.5" fill="none" stroke="#4a2f1c" stroke-width="1.4" stroke-linecap="round"/>
              </g>
              <g id="goatEyeR">
                <ellipse cx="10" cy="-1" rx="7" ry="8.4" fill="#fff"/>
                <circle cx="10.6" cy="0.8" r="4.9" fill="#4a2f1c"/>
                <circle cx="12.4" cy="-1.6" r="1.7" fill="#fff"/>
                <path d="M 16,-8 Q 13,-11 10,-9.5" fill="none" stroke="#4a2f1c" stroke-width="1.4" stroke-linecap="round"/>
              </g>
              <rect id="goatLidL" x="-18" y="-9" width="15" height="9" fill="#f9e3ac" opacity="0"/>
              <rect id="goatLidR" x="3" y="-9" width="15" height="9" fill="#f9e3ac" opacity="0"/>

              <!-- nose/mouth -->
              <ellipse cx="0" cy="11" rx="5.5" ry="4" fill="#c98f66"/>
              <ellipse id="goatMouth" cx="0" cy="17" rx="2.6" ry="2.6" fill="#8a5a3f"/>
            </g>
          </g>
        </g>

      </svg>
    </div>

    <div id="video-look"></div>
    <div id="color-cast"></div>
    <div id="scanlines"></div>
    <div id="flicker"></div>
    <div id="trackingBar"></div>
    <canvas id="grain"></canvas>
  </div>

  <div id="topLabel">● REC&nbsp;&nbsp;SP</div>

  <div id="timestamp">
    <div class="rec"><span class="dot"></span>REC</div>
    <div>28 AUG 2004</div>
    <div>00:00</div>
  </div>

  <div id="messageBox"><div id="messageText"><span id="msgTyped"></span><span class="caret">&nbsp;</span></div></div>

  <button id="musicBtn">♫ MUSIC: OFF</button>
  <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>
</div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     TIMELINE (12s loop) — now built like a "lift & present" beat:
     0.0-0.9s   idle, arms relaxed at goat's sides (anticipation window)
     0.9-1.5s   ANTICIPATION: monkey dips down slightly, arms curl toward goat
     1.5-4.3s   LIFT: arms scoop under goat's front legs, rise up to chest/face height
     4.3-4.7s   OVERSHOOT + SETTLE: tiny bounce past target then settles (2D-animation feel)
     4.7-9.0s   HOLD: idle breathing, blinking, ears/tail secondary sway
     9.0-11.0s  LOWER: gentle descent back down
     11.0-12.0s SETTLE / idle
  --------------------------------------------------------- */
  var LOOP_MS = 12000;
  var startTime = performance.now();

  var goatLift   = document.getElementById('goatLift');
  var monkeyBody = document.getElementById('monkeyBody');
  var monkeyHead = document.getElementById('monkeyHead');
  var goatHead   = document.getElementById('goatHead');
  var groundShadow = document.getElementById('groundShadow');
  var goatMouth  = document.getElementById('goatMouth');
  var goatBrowL  = document.getElementById('goatBrowL');
  var goatBrowR  = document.getElementById('goatBrowR');
  var monkeyMouth = document.getElementById('monkeyMouth');

  var armFront = document.getElementById('armFront');
  var handFront = document.getElementById('handFront');
  var armBack = document.getElementById('armBack');
  var handBack = document.getElementById('handBack');

  var earL = document.getElementById('earL'), earLin = document.getElementById('earLin');
  var earR = document.getElementById('earR'), earRin = document.getElementById('earRin');

  function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  function easeOutBack(t){ var c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
  function clamp01(x){ return Math.max(0, Math.min(1,x)); }
  function lerp(a,b,t){ return a+(b-a)*t; }

  // secondary-motion lag state (spring-follow for ears/tail)
  var earLagL = 0, earLagR = 0;

  var nextMonkeyBlink = 1500+Math.random()*2500, monkeyBlinkT0=-1;
  var nextGoatBlink = 800+Math.random()*3000, goatBlinkT0=-1;
  var BLINK_DUR = 180;

  function buildArmPath(shoulder, hand, bulge){
    var mx = (shoulder.x+hand.x)/2 + bulge.x;
    var my = (shoulder.y+hand.y)/2 + bulge.y;
    return 'M '+shoulder.x+','+shoulder.y+' Q '+mx+','+my+' '+hand.x+','+hand.y;
  }

  function animFrame(now){
    var elapsed = now-startTime;
    var t = elapsed % LOOP_MS;
    var loopIndex = Math.floor(elapsed/LOOP_MS);

    /* ---- master lift phase (0..1) with anticipation + overshoot ---- */
    var liftAmount, overshoot = 0, squash = 0;
    if(t < 900){
      liftAmount = 0;
    } else if(t < 1500){
      // anticipation: tiny dip backward before the real lift (goat sinks a touch)
      var p = clamp01((t-900)/600);
      liftAmount = -0.06*Math.sin(p*Math.PI);
      squash = 0.05*Math.sin(p*Math.PI);
    } else if(t < 4300){
      var p2 = clamp01((t-1500)/2800);
      liftAmount = easeInOutCubic(p2);
      squash = (1-p2)*0.03;
    } else if(t < 4700){
      var p3 = clamp01((t-4300)/400);
      overshoot = Math.sin(p3*Math.PI) * 0.05 * (1-p3);
      liftAmount = 1;
    } else if(t < 9000){
      liftAmount = 1;
    } else if(t < 11000){
      var p4 = clamp01((t-9000)/2000);
      liftAmount = 1-easeInOutCubic(p4);
    } else {
      liftAmount = 0;
    }
    var liftEff = clamp01(liftAmount) + overshoot;

    /* ---- goat position: from held-low near monkey's waist to presented at chest/face height ---- */
    var goatY = lerp(46, -104, liftEff) - squash*10;
    var goatX = lerp(34, 8, liftEff);
    var goatRot = lerp(8, -3, liftEff) + overshoot*20;
    var breathe = Math.sin(elapsed/900)*2.0;
    var goatScaleY = 1 + squash*0.5 + overshoot*0.15;
    var goatScaleX = 1 - squash*0.3 - overshoot*0.1;

    goatLift.setAttribute('transform',
      'translate(400,'+(300+goatY+breathe*0.35)+') rotate('+goatRot+') scale('+goatScaleX+','+goatScaleY+')'
    );

    /* ---- monkey crouch/rise with squash-stretch ---- */
    var crouch = 0, mSquash = 0;
    if(t<900){ crouch=0; }
    else if(t<1500){ var p=clamp01((t-900)/600); crouch = 10*Math.sin(p*Math.PI); mSquash = 0.03*Math.sin(p*Math.PI); }
    else if(t<4300){ var p2=clamp01((t-1500)/2800); crouch = lerp(10,-4, easeInOutCubic(p2)); }
    else if(t<4700){ var p3=clamp01((t-4300)/400); crouch = lerp(-4,0, p3); }
    else if(t<9000){ crouch = 0; }
    else if(t<11000){ var p4=clamp01((t-9000)/2000); crouch = 6*Math.sin(p4*Math.PI); }
    else { crouch = 0; }

    var monkeySway = Math.sin(elapsed/2600)*1.6;
    var monkeyBreatheScale = 1+Math.sin(elapsed/900)*0.012 + mSquash;

    monkeyBody.setAttribute('transform',
      'translate('+monkeySway+','+(crouch+breathe*0.5)+') scale('+(1-mSquash*0.6)+','+monkeyBreatheScale+')'
    );

    /* ---- head: monkey looks toward goat while lifting, gentle idle sway otherwise ---- */
    var lookAtGoat = liftEff*6;
    var headTiltIdle = Math.sin(elapsed/2100)*2.4;
    if(t>=4700 && t<9000){ lookAtGoat = 5+Math.sin(elapsed/1700)*2; }
    monkeyHead.setAttribute('transform','translate(0,-58) rotate('+(headTiltIdle*0.4 - lookAtGoat*0.55)+')');

    var goatHeadTilt = liftEff<1 ? Math.sin(elapsed/300)*1.4+(liftEff*4) : Math.sin(elapsed/1800)*2.2;
    goatHead.setAttribute('transform','translate(2,-32) rotate('+goatHeadTilt+')');

    /* ---- ARMS: dynamic scoop-and-lift curves with elbow bulge ---- */
    var shoulderF = {x:40, y:8};
    var handFrontRest = {x:16, y:76};
    var handFrontUp   = {x:30, y:-46};
    var handF = {
      x: lerp(handFrontRest.x, handFrontUp.x, liftEff),
      y: lerp(handFrontRest.y, handFrontUp.y, liftEff)
    };
    var bulgeF = { x: 34 + liftEff*10, y: -6 };
    armFront.setAttribute('d', buildArmPath(shoulderF, handF, bulgeF));
    handFront.setAttribute('cx', handF.x); handFront.setAttribute('cy', handF.y);

    var shoulderB = {x:-46, y:8};
    var handBackRest = {x:-18, y:78};
    var handBackUp   = {x:-26, y:-40};
    var handB = {
      x: lerp(handBackRest.x, handBackUp.x, liftEff),
      y: lerp(handBackRest.y, handBackUp.y, liftEff)
    };
    var bulgeB = { x:-30-liftEff*8, y:-4 };
    armBack.setAttribute('d', buildArmPath(shoulderB, handB, bulgeB));
    handBack.setAttribute('cx', handB.x); handBack.setAttribute('cy', handB.y);

    /* ---- goat mouth/brows: surprise spike during the active lift window ---- */
    var mouthOpen=1;
    if(t>900 && t<4700){ mouthOpen = 1+Math.sin(clamp01((t-900)/3800)*Math.PI)*0.95; }
    goatMouth.setAttribute('ry',(2.6*mouthOpen).toFixed(2));
    goatMouth.setAttribute('rx',(2.6+(mouthOpen-1)*1.2).toFixed(2));

    var browLift = (t>700 && t<4700) ? Math.sin(clamp01((t-700)/4000)*Math.PI)*3 : 0;
    goatBrowL.setAttribute('d','M -15,'+(-11-browLift)+' Q -10,'+(-17-browLift)+' -3,'+(-13-browLift));
    goatBrowR.setAttribute('d','M 3,'+(-13-browLift)+' Q 10,'+(-17-browLift)+' 15,'+(-11-browLift));

    // monkey's mouth softens into a gentle smile while holding
    var smileAmt = liftEff>0.5 ? 1 : 0.6;
    monkeyMouth.setAttribute('d','M -9,22 Q 0,'+(27+2*smileAmt)+' 9,22');

    /* ---- ears: spring-lag secondary motion following head tilt ---- */
    var earTarget = goatHeadTilt*0.8 + Math.sin(elapsed/500)*1.2*(1-liftEff*0.5);
    earLagL += (earTarget-earLagL)*0.12;
    earLagR += (earTarget-earLagR)*0.12;
    earL.setAttribute('transform','rotate('+earLagL+' -20 -8)');
    earLin.setAttribute('transform','rotate('+earLagL+' -20 -8)');
    earR.setAttribute('transform','rotate('+(-earLagR)+' 24 -8)');
    earRin.setAttribute('transform','rotate('+(-earLagR)+' 24 -8)');

    /* ---- shadow shrinks/fades with height ---- */
    var shadowScale = lerp(1,0.6, clamp01(liftEff));
    var shadowOpacity = lerp(0.18,0.08, clamp01(liftEff));
    groundShadow.setAttribute('transform','translate(400,430) scale('+shadowScale+',1) translate(-400,-430)');
    groundShadow.setAttribute('opacity', shadowOpacity.toFixed(2));

    handleBlink('monkey', elapsed);
    handleBlink('goat', elapsed);

    requestAnimationFrame(animFrame);

    if(loopIndex !== animFrame._lastLoop){
      animFrame._lastLoop = loopIndex;
      onLoopRestart();
    }
  }
  animFrame._lastLoop = 0;

  function handleBlink(who, elapsed){
    var lidL, lidR;
    if(who==='monkey'){ lidL=document.getElementById('lidL'); lidR=document.getElementById('lidR'); }
    else { lidL=document.getElementById('goatLidL'); lidR=document.getElementById('goatLidR'); }
    var t0 = who==='monkey'?monkeyBlinkT0:goatBlinkT0;
    var nextT = who==='monkey'?nextMonkeyBlink:nextGoatBlink;
    if(t0<0 && elapsed>nextT){ if(who==='monkey'){monkeyBlinkT0=elapsed;}else{goatBlinkT0=elapsed;} t0=elapsed; }
    if(t0>=0){
      var dt = elapsed-t0;
      if(dt<=BLINK_DUR){
        var phase=dt/BLINK_DUR;
        var op = phase<0.5 ? phase*2 : (1-phase)*2;
        lidL.setAttribute('opacity', op.toFixed(2));
        lidR.setAttribute('opacity', op.toFixed(2));
      } else {
        lidL.setAttribute('opacity',0); lidR.setAttribute('opacity',0);
        if(who==='monkey'){ monkeyBlinkT0=-1; nextMonkeyBlink=elapsed+2000+Math.random()*3500; }
        else { goatBlinkT0=-1; nextGoatBlink=elapsed+1500+Math.random()*3800; }
      }
    }
  }

  requestAnimationFrame(animFrame);

  /* ---------------------------------------------------------
     TYPING TEXT
  --------------------------------------------------------- */
  var fullText = "yaxşı ki varsan keçicim, yüz yaşa";
  var msgEl = document.getElementById('msgTyped');
  var typingTimer = null;
  var typeStartDelay = 1200;
  var typeCharInterval = 170;

  function clearTyping(){ if(typingTimer){clearTimeout(typingTimer); typingTimer=null;} }
  function startTyping(){
    clearTyping();
    msgEl.textContent='';
    var i=0;
    function tick(){
      if(i<=fullText.length){
        msgEl.textContent = fullText.slice(0,i);
        i++;
        typingTimer = setTimeout(tick, typeCharInterval+(Math.random()*60-20));
      }
    }
    typingTimer = setTimeout(tick, typeStartDelay);
  }
  function onLoopRestart(){ startTyping(); }
  startTyping();

  /* ---------------------------------------------------------
     GRAIN CANVAS
  --------------------------------------------------------- */
  var canvas = document.getElementById('grain');
  var ctx = canvas.getContext('2d');
  function resizeCanvas(){ canvas.width=window.innerWidth*0.5; canvas.height=window.innerHeight*0.5; }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  var grainImgData=null;
  function drawGrain(){
    var w=canvas.width,h=canvas.height;
    if(!grainImgData||grainImgData.width!==w||grainImgData.height!==h){ grainImgData=ctx.createImageData(w,h); }
    var data=grainImgData.data;
    for(var i=0;i<data.length;i+=4){
      var v=128+(Math.random()*255-127)*0.6;
      data[i]=v;data[i+1]=v;data[i+2]=v;data[i+3]=40;
    }
    ctx.putImageData(grainImgData,0,0);
  }
  var lastGrain=0;
  function grainLoop(now){
    if(now-lastGrain>60){ drawGrain(); lastGrain=now; }
    requestAnimationFrame(grainLoop);
  }
  requestAnimationFrame(grainLoop);

  /* ---------------------------------------------------------
     TRACKING GLITCH BAR
  --------------------------------------------------------- */
  var trackingBar = document.getElementById('trackingBar');
  function scheduleTracking(){
    var delay=4000+Math.random()*9000;
    setTimeout(function(){
      trackingBar.style.transition='none';
      trackingBar.style.top='-20px';
      trackingBar.style.opacity='0.5';
      var duration=380+Math.random()*260;
      var startT=performance.now();
      function move(now){
        var p=Math.min(1,(now-startT)/duration);
        trackingBar.style.top=(-20+p*(window.innerHeight+40))+'px';
        trackingBar.style.opacity=(0.5*(1-p*0.6)).toString();
        if(p<1){ requestAnimationFrame(move); } else { trackingBar.style.opacity='0'; }
      }
      requestAnimationFrame(move);
      scheduleTracking();
    }, delay);
  }
  scheduleTracking();

  /* ---------------------------------------------------------
     MP3 MUSIC (music.mp3)
  --------------------------------------------------------- */
  var musicOn=false;
  var bgMusic=document.getElementById('bgMusic');
  bgMusic.volume=0.6;
  var musicBtn=document.getElementById('musicBtn');

  function playMusic(){
    var p=bgMusic.play();
    if(p&&p.then){
      p.then(function(){ musicOn=true; musicBtn.textContent='♫ MUSIC: ON'; })
       .catch(function(){ musicOn=false; musicBtn.textContent='♫ MUSIC: OFF'; });
    } else {
      musicOn=true; musicBtn.textContent='♫ MUSIC: ON';
    }
  }
  function pauseMusic(){
    bgMusic.pause();
    musicOn=false;
    musicBtn.textContent='♫ MUSIC: OFF';
  }

  musicBtn.addEventListener('click', function(){
    if(musicOn){ pauseMusic(); } else { playMusic(); }
  });

  /* Try to autoplay as soon as the page loads. Most browsers block
     autoplay with sound until the user interacts with the page, so
     if that fails we fall back to starting on the very first
     click/touch/keypress anywhere on the page. */
  playMusic();
  function primeAudio(){
    if(!musicOn){ playMusic(); }
    window.removeEventListener('touchstart',primeAudio);
    window.removeEventListener('click',primeAudio);
    window.removeEventListener('keydown',primeAudio);
  }
  window.addEventListener('touchstart', primeAudio, {once:true});
  window.addEventListener('click', primeAudio, {once:true});
  window.addEventListener('keydown', primeAudio, {once:true});

})();
</script>
</body>
